[project]
name = "jaqsi-data"
version = "0.1.0"
description = "Benchmarking related experiments for the JAQSI simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qml-essentials",
    "omegaconf>=2.3",
    "matplotlib>=3.10.8",
    "qiskit>=1.0",
    "qiskit-aer>=0.17",
    "qibo>=0.2",
    "qibojit>=0.1; python_version < '3.14'",
    "pennylane>=0.44.1",
    "qulacs>=0.6",
    "psutil>=5.9",
    "tensorboard-plugin-profile>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark", "src/profiling"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
qml-essentials = { git = "https://github.com/cirKITers/qml-essentials", rev = "d493adc2d8712f99b401e1f1c0dbd3041c6012da" }

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# qibojit caps psutil<6.0.0, but qml-essentials requires psutil>=7.2.2.
# psutil's APIs used by qibojit (cpu_count, virtual_memory) are stable across
# 6.x/7.x, so force the newer psutil past qibojit's stale upper bound.
override-dependencies = ["psutil>=7.2.2"]