[project]
name = "jaqsi-data"
version = "0.1.0"
description = "Benchmarking related experiments for the JAQSI simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jaqsi",
    "omegaconf>=2.3",
    "matplotlib>=3.10.8",
    "qiskit>=1.0",
    "qiskit-aer>=0.17",
    "qibo>=0.2",
    "qibojit>=0.1; python_version < '3.14'",
    "pennylane>=0.44.1",
    "qulacs>=0.6",
    "psutil>=5.9",
    "qutip>=5.0",
    "dynamiqs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark", "src/profiling"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
jaqsi = { git = "https://github.com/cirKITers/jaqsi", rev = "8dbdbaf174b06a61d3668eab7b76b6d0716c3708" }
# The dynamiqs release on PyPI (0.3.4) caps jax<0.7, which conflicts with
# jaqsi.  The relaxed bound (jax>=0.4.36, !=0.7.0, !=0.7.1) only
# exists on the development branch, so pin a commit from there.
dynamiqs = { git = "https://github.com/dynamiqs/dynamiqs", rev = "8119714466d310621b1752f6874725f45803371c" }

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# qibojit caps psutil<6.0.0, but jaqsi requires psutil>=7.2.2.
# psutil's APIs used by qibojit (cpu_count, virtual_memory) are stable across
# 6.x/7.x, so force the newer psutil past qibojit's stale upper bound.
override-dependencies = ["psutil>=7.2.2"]