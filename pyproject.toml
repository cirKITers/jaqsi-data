[project]
name = "yaqsi-data"
version = "0.1.0"
description = "Benchmarking related experiments for the YAQSI simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qml-essentials",
    "omegaconf>=2.3",
    "matplotlib>=3.10.8",
    "qiskit>=1.0",
    "qibo>=0.2",
    "pennylane>=0.44.1",
    "qulacs>=0.6",
    "psutil>=5.9",
    "tensorboard-plugin-profile>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark", "src/profiling"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
qml-essentials = { git = "https://github.com/cirKITers/qml-essentials", rev = "715ae71914e1879bf334308fd66ee29de16c5eb1" }

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]