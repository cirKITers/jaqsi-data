[project]
name = "jaqsi-data"
version = "0.1.0"
description = "Benchmarks and profiles for the JAQSI simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jaqsi",
    "omegaconf>=2.3",
    "matplotlib>=3.10.8",
    "qiskit>=1.0",
    "qiskit-aer>=0.17",
    "qibo>=0.2",
    "qibojit>=0.1; python_version < '3.14'",
    "pennylane>=0.44.1",
    "qulacs>=0.6",
    "psutil>=5.9",
    "qutip>=5.0",
    "dynamiqs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark", "src/profiling"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
# Pin dynamiqs to a commit compatible with JAQSI's JAX version.
dynamiqs = { git = "https://github.com/dynamiqs/dynamiqs", rev = "991fd45a9d46c1220095633bad453b005276e9f7" }
jaqsi = { git = "https://github.com/cirKITers/jaqsi", rev = "56aee46cdcfcc635ad72711ac0b9a8b35cfb7431" }

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Resolve the qibojit and JAQSI psutil version conflict.
override-dependencies = ["psutil>=7.2.2"]
