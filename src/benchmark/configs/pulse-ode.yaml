# Pulse-level benchmark configuration without jaqsi's closed-form pulse solve.
# Identical to pulse.yaml except for `closed_form`, so the two runs differ only
# in how jaqsi_pulse integrates its pulses.
seed: 1000
warmup: true
# Pulse results carry the ODE solver error of each backend, so the
# cross-validation tolerance is set by the solver rather than by machine
# precision.  The error accumulates over the $21 n$ solves the schedule runs in
# sequence, and expval amplifies it because it sums $2^n$ probabilities: at 8
# qubits the full-register path deviates by $1.2 \cdot 10^{-6}$ there against
# $3 \cdot 10^{-8}$ in probs.  This tolerance covers the sweep up to
# ``qubits.max``; a wider one needs more headroom.
precision: 1.0e-5

# Use performance-optimized simulator configurations.  For pennylane this
# integrates the segments with jax.experimental.ode directly instead of going
# through ParametrizedEvolution, whose per-operation overhead costs about
# 190 ms per segment and otherwise dominates the whole run.
optimal_config: true

# Under the RWA every pulse is a single-term drive $f(t) H$, which jaqsi solves
# in closed form as $e^{-i F H}$, integrating only the scalar pulse area $F$.
# Switching that off makes jaqsi_pulse integrate the matrix ODE
# $\mathrm{d}U/\mathrm{d}t = -i f(t) H U$ like PennyLane, QuTiP and dynamiqs.
# The simulator is still labelled jaqsi_pulse, so the setting is recorded in
# the provenance sidecar and an auto-generated identifier gets an `-ode` suffix.
closed_form: false

# Threads every simulator is pinned to, before any numerical library is
# imported.  One is the single-thread regime the Yao, Qulacs and JuliVQC
# benchmarks report; set it to the core count for the multi-threaded regime and
# report the two separately.  Without this, qibojit silently takes one thread
# per available core while nothing else is pinned.
threads: 1

# The pulse model only transcribes the Hadamard and CRX decompositions, so the
# pulse benchmark runs the crx_ring family.  Each additional layer adds another
# 21 n sequential ODE solves, which is why the depth sweep stays at one layer.
circuit:
  family: crx_ring
  layers:
    - 1

# Qubit sweep range (inclusive).  The schedule has 21 segments per qubit, each
# solved sequentially, so the runtime grows faster than in the gate benchmark.
qubits:
  min: 2
  max: 8

# Execution settings
execution:
  n_iters: 20
  batch_size: 2

# Which measurement modes to benchmark.  The pulse level measures forward
# simulation only; `grad` is a gate-level mode.
modes:
  - expval
  # - state
  - density
  # - probs
  - noise

# Which simulators to run (subset of: jaqsi_pulse, pennylane_pulse,
# qutip_pulse, dynamiqs_pulse)
simulators:
  - jaqsi_pulse
  - pennylane_pulse
  - qutip_pulse
  - dynamiqs_pulse

# Output settings
output:
  dir: results
  # Set a fixed identifier to resume a previous run; null generates a timestamp
  identifier: null
