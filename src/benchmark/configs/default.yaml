# Default gate-level benchmark.
seed: 1000
warmup: true
precision: 1.0e-8

# Use optimized simulator configurations.
optimal_config: true

# Threads per simulator.
threads: 1

# Circuit family and depths to sweep.
circuit:
  family: hea
  layers:
    - 1

# Inclusive qubit range.
qubits:
  min: 2
  max: 14

# Iterations and batch size.
execution:
  n_iters: 20
  batch_size: 10

# Workloads to benchmark.
modes:
  - expval
  # - state
  - density
  - grad
  # - probs
  - noise

# Per-gate depolarizing probability in noise mode.
depolarizing: 0.01

# Simulators to benchmark.
simulators:
  - jaqsi
  - pennylane
  - pennylane_lightning
  # - pennylane_psr
  - qiskit
  - qibo
  - qulacs

# Output location and run identifier.
output:
  dir: results
  # Use a fixed identifier to resume a run.
  identifier: null
