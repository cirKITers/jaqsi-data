# Pulse-level benchmark.
seed: 1000
warmup: true
# Cross-validation tolerance for pulse solvers.
precision: 1.0e-5

# Use optimized simulator configurations.
optimal_config: true

# Driven-rotation pulse envelope.
envelope: gaussian

# Threads per simulator.
threads: 1

# Circuit family and depths to sweep.
circuit:
  family: crx_ring
  layers:
    - 1

# Inclusive qubit range.
qubits:
  min: 2
  max: 8

# Iterations and batch size.
execution:
  n_iters: 20
  batch_size: 2

# Workloads to benchmark.
modes:
  - expval
  # - state
  - density
  # - probs
  - noise

# Pulse simulators to benchmark.
simulators:
  - jaqsi_pulse
  - pennylane_pulse
  - qutip_pulse
  - dynamiqs_pulse

# Output location and run identifier.
output:
  dir: results
  # Use a fixed identifier to resume a run.
  identifier: null
